<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phaedrus</title>
    <meta
      name="description"
      content="Making things. Beautiful, useful, or just fun."
    />
    <link rel="canonical" href="https://phaedrus.io/" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20fill='%232643d0'/%3E%3Ctext%20x='16'%20y='17'%20dominant-baseline='central'%20text-anchor='middle'%20fill='%23fcfcfc'%20style='font:600%2021px%20Arial,sans-serif'%3EP%3C/text%3E%3C/svg%3E"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://phaedrus.io/" />
    <meta property="og:site_name" content="Phaedrus" />
    <meta property="og:title" content="Phaedrus" />
    <meta
      property="og:description"
      content="Making things. Beautiful, useful, or just fun."
    />
    <meta
      property="og:image"
      content="https://phaedrus.io/assets/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Phaedrus. Making things. Beautiful, useful, or just fun."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Phaedrus" />
    <meta
      name="twitter:description"
      content="Making things. Beautiful, useful, or just fun."
    />
    <meta
      name="twitter:image"
      content="https://phaedrus.io/assets/og-image.png"
    />
    <meta
      name="twitter:image:alt"
      content="Phaedrus. Making things. Beautiful, useful, or just fun."
    />
    <meta name="theme-color" content="#2643d0" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("ae-mode");
          if (saved === "dark" || saved === "light") {
            document.documentElement.dataset.aeMode = saved;
          }
        } catch {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/misty-step/aesthetic@v0.25.0/aesthetic.css"
      integrity="sha384-SrhwZwmgRlmOW+wK+CaZcarD/NCTFypxEUIxAaMxAP4vlBX15QTCqxagjT81KBZf"
      crossorigin="anonymous"
    />
    <script src="/canary-observer.js"></script>
    <style>
      :root {
        --ae-font: "Space Grotesk", Arial, sans-serif;
        --portrait-cobalt: #2643d0;
        --portrait-paper: #fcfcfc;
        font-synthesis: none;
      }
      .portrait-page,
      .portrait-page * {
        box-sizing: border-box;
      }
      .portrait-page [hidden] {
        display: none !important;
      }
      .poster {
        padding-top: clamp(24px, 2.4vw, 48px);
        overflow: hidden;
        color: var(--portrait-paper);
        background: var(--portrait-cobalt);
      }
      .poster ::selection {
        color: var(--portrait-cobalt);
        background: var(--portrait-paper);
      }
      .poster h1 {
        position: relative;
        z-index: 1;
        padding-inline: 3.2vw 4.8vw;
        font-size: clamp(64px, 22vw, 352px);
        font-weight: 600;
        letter-spacing: -0.085em;
        line-height: 1;
        text-align: center;
        white-space: nowrap;
      }
      .portrait {
        width: min(44vw, 590px);
        margin: -32px auto -168px;
      }
      .portrait img {
        display: block;
        width: 100%;
        height: auto;
        filter: brightness(0) invert(1);
      }
      .reading-band {
        position: relative;
        z-index: 2;
        color: var(--ae-ink);
        background: var(--ae-surface);
      }
      .caption {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(240px, 0.6fr);
        gap: clamp(48px, 8vw, 140px);
        width: min(100%, 1600px);
        margin-inline: auto;
        padding: clamp(40px, 4.5vw, 76px) clamp(24px, 5.6vw, 96px) 48px;
      }
      .introduction {
        max-width: 650px;
        font-size: clamp(26px, 2.4vw, 37px);
        font-weight: 400;
        letter-spacing: -0.045em;
        line-height: 1.35;
      }
      .exits {
        display: flex;
        flex-direction: column;
        align-self: start;
      }
      .exits a {
        display: flex;
        align-items: center;
        gap: var(--ae-space-2);
        min-height: 44px;
        margin-block: 0;
        padding-block: 12px;
        border-bottom: 1px solid var(--ae-line);
        font-size: 23px;
        font-weight: 500;
        letter-spacing: -0.035em;
        line-height: 1.4;
        text-decoration: none;
      }
      .exits a:first-child {
        padding-top: 0;
      }
      .exits a:hover {
        border-color: var(--ae-accent);
      }
      .exits .ae-icon {
        flex: none;
        width: 1em;
        height: 1em;
      }
      .quote-band {
        border-top: 1px solid var(--ae-line);
      }
      .quote-chyron {
        width: min(100%, 1600px);
        margin-inline: auto;
        padding: 32px clamp(24px, 5.6vw, 96px) 24px;
      }
      /* The reserve includes multiline verse and its attribution, not just prose. */
      .quote-copy {
        max-width: 68ch;
        min-height: 16rem;
        margin: 0;
        overflow-wrap: anywhere;
      }
      .quote-copy blockquote {
        line-height: 1.6;
        white-space: pre-line;
      }
      .quote-attribution {
        margin-top: var(--ae-space-4);
        color: var(--ae-ink-muted);
        font-size: 13px;
        line-height: 1.6;
      }
      .quote-tools {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--ae-space-4);
        min-height: 44px;
        margin-top: var(--ae-space-5);
        font-size: 13px;
      }
      .quote-tools .ae-mode {
        width: 44px;
        height: 44px;
        margin-left: auto;
      }
      @media (min-width: 1800px) {
        .portrait {
          width: 650px;
          margin-bottom: -190px;
        }
      }
      @media (max-width: 900px) {
        .portrait {
          width: 55vw;
          margin-top: -12px;
          margin-bottom: -112px;
        }
        .caption {
          grid-template-columns: minmax(0, 1fr) 190px;
          gap: 44px;
        }
        .introduction {
          font-size: 28px;
        }
        .exits a {
          font-size: 20px;
        }
      }
      @media (max-width: 600px) {
        .poster {
          padding-top: 32px;
        }
        .portrait {
          width: 82vw;
          margin-top: 18px;
          margin-bottom: -64px;
        }
        .caption {
          grid-template-columns: minmax(0, 1fr);
          gap: 28px;
          padding-block: 36px;
        }
        .introduction {
          font-size: 26px;
          line-height: 1.4;
          letter-spacing: -0.04em;
        }
        .exits {
          flex-direction: row;
          flex-wrap: wrap;
          gap: 12px 24px;
        }
        .exits a,
        .exits a:first-child {
          padding-block: 8px;
          font-size: 18px;
        }
        .quote-chyron {
          padding-block: 28px 20px;
        }
      }
      @media (max-width: 350px) {
        .poster {
          padding-top: 24px;
        }
        .portrait {
          margin-top: 20px;
          margin-bottom: -48px;
        }
        .introduction {
          font-size: 24px;
        }
        .exits {
          column-gap: 22px;
        }
      }
      @media (max-width: 374px) {
        .quote-copy {
          min-height: 23rem;
        }
      }
    </style>
  </head>
  <body class="portrait-page">
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
          />
        </symbol>
        <symbol id="i-moon" viewBox="0 0 24 24">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
        </symbol>
        <symbol id="i-briefcase" viewBox="0 0 24 24">
          <path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
          <rect width="20" height="14" x="2" y="6" rx="2" />
        </symbol>
        <symbol id="i-github" viewBox="0 0 24 24">
          <path
            d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"
          />
          <path d="M9 18c-4.51 2-5-2-7-2" />
        </symbol>
        <symbol id="i-mail" viewBox="0 0 24 24">
          <rect x="2" y="4" width="20" height="16" rx="2" />
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
        </symbol>
      </defs>
    </svg>
    <main aria-labelledby="name">
      <div class="poster">
        <h1 id="name">Phaedrus</h1>
        <figure class="portrait">
          <img
            src="assets/portrait-dots.svg"
            width="227"
            height="256"
            alt="Halftone line-art portrait of Phaedrus."
          />
        </figure>
      </div>
      <div class="reading-band">
        <div class="caption">
          <p class="introduction">
            Making things. Beautiful, useful, or just fun.
          </p>
          <nav class="exits" aria-label="Find me elsewhere">
            <a href="https://www.mistystep.io/"
              ><svg class="ae-icon" aria-hidden="true">
                <use href="#i-briefcase" /></svg
              >Misty Step</a
            >
            <a href="https://github.com/moomooskycow"
              ><svg class="ae-icon" aria-hidden="true">
                <use href="#i-github" /></svg
              >GitHub</a
            >
            <a href="mailto:phaedrus@sent.com"
              ><svg class="ae-icon" aria-hidden="true">
                <use href="#i-mail" /></svg
              >Email</a
            >
          </nav>
        </div>
      </div>
    </main>
    <footer class="reading-band quote-band">
      <section
        class="quote-chyron"
        id="quote-chyron"
        aria-label="Selected quotations"
      >
        <figure class="quote-copy" id="quote-copy">
          <blockquote><p id="quote-text">Avoid boredom.</p></blockquote>
          <figcaption class="quote-attribution" id="quote-attribution">
            Nassim Nicholas Taleb
          </figcaption>
        </figure>
        <div class="quote-tools">
          <button
            class="ae-mode"
            id="mode"
            type="button"
            aria-label="Toggle color mode"
            hidden
          >
            <svg class="ae-icon ae-sun" aria-hidden="true">
              <use href="#i-sun" />
            </svg>
            <svg class="ae-icon ae-moon" aria-hidden="true">
              <use href="#i-moon" />
            </svg>
          </button>
        </div>
      </section>
    </footer>
    <script>
      (() => {
        const root = document.documentElement;
        const mode = document.getElementById("mode");
        const systemMode = matchMedia("(prefers-color-scheme: dark)");
        const isDark = () =>
          root.dataset.aeMode
            ? root.dataset.aeMode === "dark"
            : systemMode.matches;
        const updateLabel = () => {
          mode.setAttribute(
            "aria-label",
            isDark() ? "Use light mode" : "Use dark mode",
          );
        };
        mode.addEventListener("click", () => {
          const next = isDark() ? "light" : "dark";
          root.dataset.aeMode = next;
          try {
            localStorage.setItem("ae-mode", next);
          } catch {}
          updateLabel();
        });
        systemMode.addEventListener("change", updateLabel);
        updateLabel();
        mode.hidden = false;
      })();
    </script>
    <script src="quotes.js"></script>
    <script src="quote-chyron.js"></script>
  </body>
</html>
