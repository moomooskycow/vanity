name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      alert_probe:
        description: Fail safely to exercise the agent alert route without deploying
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/release.mjs title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  check:
    name: repo gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned native provider tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run repo-owned gate
        run: ./scripts/check.sh
      - name: Dry-run actual Worker publication and committed public artifact without credentials
        run: node scripts/deploy.mjs --preflight
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  deploy:
    name: production deploy and smoke
    needs: check
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned native provider tooling
        if: ${{ !inputs.alert_probe }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Controlled alert probe
        if: inputs.alert_probe
        run: |
          echo "::error::Controlled vanity deployment failure; production is unchanged."
          exit 1
      - name: Publish merged source and smoke both domains
        if: ${{ !inputs.alert_probe }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/deploy.mjs

  release:
    needs: [check, deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refuse unverified or superseded source
        id: source
        run: node scripts/release.mjs current
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: steps.source.outputs.current == 'true'
        id: release
      - name: Approve real native CI for the generated PR
        if: steps.release.outputs.prs_created == 'true'
        run: node scripts/release.mjs approve-ci
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}

  alert:
    name: alert agent on production failure
    needs: [check, deploy, release]
    if: >-
      always() && github.ref == 'refs/heads/master' &&
      (needs.check.result == 'failure' || needs.deploy.result == 'failure' || needs.release.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Send failure to the existing Vanity Sentry agent intake
        env:
          SENTRY_DSN: https://dd3f79d117806f5bbd934413add4ae9d@o4510313803677696.ingest.us.sentry.io/4510314423386112
          CHECK_RESULT: ${{ needs.check.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          ALERT_PROBE: ${{ inputs.alert_probe && 'yes' || 'no' }}
        run: node scripts/alert-deploy.mjs
