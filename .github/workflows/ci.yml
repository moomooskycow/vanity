name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  local-gate:
    name: local gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run repository gate
        run: ./scripts/ci.sh gate

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: local-gate
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Generate V8 coverage
        run: ./scripts/ci.sh coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: node-v8-coverage
          path: coverage/
          if-no-files-found: error
