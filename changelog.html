<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Changelog — Phaedrus</title>
    <meta name="description" content="Release notes for phaedrus.io." />
    <link rel="canonical" href="https://phaedrus.io/changelog" />
    <script>
      try {
        const saved = localStorage.getItem("ae-mode");
        if (saved === "light" || saved === "dark") document.documentElement.dataset.aeMode = saved;
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/misty-step/aesthetic@v0.25.0/aesthetic.css"
      integrity="sha384-SrhwZwmgRlmOW+wK+CaZcarD/NCTFypxEUIxAaMxAP4vlBX15QTCqxagjT81KBZf" crossorigin="anonymous" />
    <style>
      :root { --ae-font: "Space Grotesk", Arial, sans-serif; font-synthesis: none; }
      body { max-width: 52rem; margin-inline: auto; padding: clamp(24px, 6vw, 72px); overflow-wrap: anywhere; }
      nav { margin-bottom: var(--ae-space-8); }
      nav a { display: inline-flex; align-items: center; min-height: 44px; }
      h1 { font-size: clamp(36px, 8vw, 64px); letter-spacing: -0.05em; }
      h2 { margin-top: var(--ae-space-10); padding-top: var(--ae-space-6); border-top: 1px solid var(--ae-line); }
      h3 { margin-top: var(--ae-space-6); }
      p { margin-block: var(--ae-space-3); line-height: 1.7; }
      .identity { color: var(--ae-ink-muted); font-size: 13px; margin-block: var(--ae-space-4) var(--ae-space-8); }
      .change { padding-left: var(--ae-space-4); border-left: 2px solid var(--ae-line); }
    </style>
  </head>
  <body>
    <nav aria-label="Site"><a href="/">← Phaedrus</a></nav>
    <main>
      <h1>Changelog</h1>
      <p class="identity"><!-- release --></p>
      <!-- notes -->
    </main>
  </body>
</html>
